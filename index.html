<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пульт Управления Вторым Экраном</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: Arial, sans-serif; text-align: center; }
        #screen-container { width: 100vw; max-height: 50vh; background: black; overflow: hidden; display: flex; justify-content: center; }
        #screen { width: 100%; height: auto; object-fit: contain; }
        .row { display: flex; justify-content: center; gap: 5px; margin: 8px 3px; flex-wrap: wrap; }
        button { background: #333; color: white; border: 1px solid #555; padding: 10px 15px; font-size: 14px; border-radius: 5px; min-width: 50px; touch-action: manipulation; }
        button:active { background: #007bff; }
        .mouse-btn { background: #007bff; font-weight: bold; flex: 1; padding: 15px; max-width: 150px; }
        input { background: #222; color: white; border: 1px solid #555; padding: 10px; width: 70%; border-radius: 5px; font-size: 16px; }
    </style>
</head>
<body>

    <div id="screen-container">
        <img id="screen" src="" alt="Ожидание ввода номера...">
    </div>

    <!-- МЫШЬ -->
    <div class="row">
        <button class="mouse-btn" onclick="sendCmd('click', 'left')">ЛКМ</button>
        <button class="mouse-btn" onclick="sendCmd('click', 'right')">ПКМ</button>
    </div>

    <!-- ТЕКСТ -->
    <div class="row">
        <input type="text" id="text-input" placeholder="Введите текст...">
        <button onclick="sendText()">Отправить</button>
    </div>

    <!-- КЛАВИШИ -->
    <div class="row">
        <button onclick="sendCmd('key', 'enter')">Enter</button>
        <button onclick="sendCmd('key', 'backspace')">← Стереть</button>
        <button onclick="sendCmd('key', 'space')">Пробел</button>
        <button onclick="sendCmd('key', 'tab')">Tab</button>
    </div>

    <div class="row" id="f-keys"></div>

    <script>
        let serverUrl = "";
        const laptopNumber = prompt("Введите Номер Компьютера:", "7777");

        fetch(`https://keyvalue.xyz{laptopNumber}/ip`)
            .then(res => res.text())
            .then(ip => {
                if (!ip || ip.includes("Error")) {
                    alert("Ноутбук не найден!");
                    return;
                }
                serverUrl = `http://${ip.trim()}:5000`;
                updateScreen();
            })
            .catch(err => alert("Ошибка подключения к облаку!"));

        const screenImg = document.getElementById('screen');
        function updateScreen() {
            if (!serverUrl) return;
            screenImg.src = `${serverUrl}/screenshot?t=${Date.now()}`;
        }
        screenImg.onload = () => setTimeout(updateScreen, 40);
        screenImg.onerror = () => setTimeout(updateScreen, 1000);

        screenImg.addEventListener('click', (e) => {
            const rect = screenImg.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const y = (e.clientY - rect.top) / rect.height;
            sendCmd('mouse_click', { rx: x, ry: y });
        });

        function sendCmd(type, data) {
            if (!serverUrl) return;
            fetch(`${serverUrl}/command`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type: type, data: data })
            }).catch(err => console.log(err));
        }

        function sendText() {
            const input = document.getElementById('text-input');
            if(input.value) {
                sendCmd('write', input.value);
                input.value = '';
            }
        }

        const fContainer = document.getElementById('f-keys');
        for (let i = 1; i <= 12; i++) {
            let btn = document.createElement('button');
            btn.innerText = `F${i}`;
            btn.onclick = () => sendCmd('key', `f${i}`);
            fContainer.appendChild(btn);
        }
    </script>
</body>
</html>
